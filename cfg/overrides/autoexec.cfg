clear
exec reset

// Show fps while viewing scoreboard
bind tab +DisplayScoreboard
alias "+DisplayScoreboard" "+showscores; cl_showfps 1"
alias "-DisplayScoreboard" "-showscores; cl_showfps 0"

// Sensitivity = 32.4 cm/360
// Mouse sensitivity (DPI = 800)
// http://www.notalent.org/sensitivity/sensitivity.htm

// Win10 : 6/11
// Pop OS: gsettings set org.gnome.desktop.peripherals.mouse speed 0.0
//         gsettings set org.gnome.desktop.peripherals.mouse accel-profile 'flat'
alias sens_normal "sensitivity 1.50"
alias sens_half   "sensitivity 0.75"

m_rawinput 1

// Sprays are disabled by default
// r_decals 99999; r_decal_cullsize 1; r_decalstaticprops 1; r_drawmodeldecals 1; r_drawbatchdecals 1; cl_allowdownload 1; cl_allowupload 1; mp_decals 99999; tf_delete_temp_files 0
alias enablesprays  "r_decals 800; mp_decals 800; cl_spraydisable 0; r_spray_lifetime 2; r_decal_cullsize 1;  r_decalstaticprops 1; r_drawmodeldecals 1; r_drawbatchdecals 1; cl_allowdownload 1; cl_allowupload 1;  tf_delete_temp_files 0; echo Sprays Enabled"
alias disablesprays "r_decals 0;   mp_decals 0;   cl_spraydisable 1; r_spray_lifetime 0; r_decal_cullsize 20; echo Sprays Disabled"

// Damage sounds
tf_dingaling_pitchmindmg 140
tf_dingaling_pitchmaxdmg 5

volume 0.03125
voice_enable 1  // Enable voice chat

sv_allow_point_servercommand always

// Batch "damage/healing done" text
hud_combattext_batching 1
hud_combattext_healing 1
hud_combattext_batching_window 3 // # second grouping

cl_autoreload 1               // Reload without pressing 'r'
fov_desired 90                // Actual first-person FOV
zoom_sensitivity_ratio 0.85714285714

echo "***** Autoexec CFG Loaded *****"
